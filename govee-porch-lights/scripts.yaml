porch_halloween_candle:
  alias: Porch - Halloween Candle & Lightning
  description: 'All six porch wall lights glow deep orange and flicker like candles
    (each light jumps to a random 35-100% of the target brightness, one light at a
    time over Matter, every ~0.3-0.6 s). Every 20-40 s (by the clock), a lightning
    strike: two quick cool-white flashes on 1-3 neighbouring lights at a random spot
    (about 1 in 4 on the whole porch), then back to candlelight. Eaves are left alone
    (a flash would restart their WLED playlist). Stops at sunrise, when the porch
    turns off, during porch activity, when Porch - Holiday Cycle moves on, or after
    14 h.'
  mode: restart
  icon: mdi:candle
  sequence:
  - variables:
      lights:
      - light.porch_wall_light
      - light.walk_porch_light
      - light.walkway_wall_light
      - light.left_wall_light
      - light.center_wall_light
      - light.right_wall_light
      candle:
      - 255
      - 70
      - 0
      next_at: '{{ as_timestamp(now()) + range(10, 20) | random }}'
  - alias: Nudge so Matter applies the orange
    action: light.turn_on
    target:
      entity_id: light.porch_effect_group
    data:
      color_temp_kelvin: 4000
  - delay: 00:00:02
  - action: light.turn_on
    target:
      entity_id: light.porch_effect_group
    data:
      rgb_color: '{{ candle }}'
      brightness: '{{ states(''input_number.porch_light_target_brightness'') | int(191)
        }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.porch_current_look
    data:
      value: script.porch_halloween_candle
  - repeat:
      while:
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - alias: Porch not turned off
        condition: not
        conditions:
        - condition: state
          entity_id: light.porch_effect_group
          state: 'off'
      - alias: Not while porch activity has everything on base white
        condition: state
        entity_id: input_boolean.porch_activity_override
        state: 'off'
      - condition: template
        value_template: '{{ repeat.index < 100000 }}'
      sequence:
      - variables:
          hi: '{{ states(''input_number.porch_light_target_brightness'') | int(191)
            }}'
          order: '{{ lights | shuffle }}'
      - if:
        - alias: Lightning every 20-40 s by the clock (a flicker tick is ~0.9 s over
            Matter, so counting ticks made strikes only about once a minute)
          condition: template
          value_template: '{{ as_timestamp(now()) >= next_at }}'
        then:
        - alias: Pick where it strikes - usually 1-3 neighbouring lights at a random
            spot (lights are in left-to-right order), about 1 in 4 the whole porch
          variables:
            width: '{{ 6 if (range(4) | random) == 0 else range(1, 4) | random }}'
            start: '{{ range(0, 7 - width) | random }}'
            strike: '{{ lights[start:start + width] }}'
        - action: light.turn_on
          target:
            entity_id: '{{ strike }}'
          data:
            color_temp_kelvin: 6500
            brightness: 255
            transition: 0
        - delay:
            milliseconds: 300
        - action: light.turn_on
          target:
            entity_id: '{{ strike }}'
          data:
            brightness: 1
            transition: 0
        - delay:
            milliseconds: '{{ range(150, 400) | random }}'
        - action: light.turn_on
          target:
            entity_id: '{{ strike }}'
          data:
            color_temp_kelvin: 6500
            brightness: 255
            transition: 0
        - delay:
            milliseconds: 450
        - action: light.turn_on
          target:
            entity_id: '{{ strike }}'
          data:
            rgb_color: '{{ candle }}'
            brightness: '{{ (hi * 0.5) | int }}'
        - variables:
            next_at: '{{ as_timestamp(now()) + range(20, 40) | random }}'
        else:
        - alias: Candle flicker, one light at a time
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ order[0] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
          - action: light.turn_on
            target:
              entity_id: '{{ order[1] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
          - action: light.turn_on
            target:
              entity_id: '{{ order[2] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
          - action: light.turn_on
            target:
              entity_id: '{{ order[3] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
          - action: light.turn_on
            target:
              entity_id: '{{ order[4] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
          - action: light.turn_on
            target:
              entity_id: '{{ order[5] }}'
            data:
              brightness: '{{ (hi * (range(35, 101) | random) / 100) | int }}'
      - delay:
          milliseconds: '{{ range(300, 600) | random }}'

porch_halloween_cycle:
  alias: Porch - Halloween Cycle
  description: 'Halloween rotation for the porch wall lights (runs Porch - Holiday
    Cycle), Oct 25-31 from the holiday lights calendar: Govee Halloween, Pumpkin &
    Potion, Halloween multicolor, Govee Halloween B, Pumpkin & Potion swapped, multicolor
    1 min per look (candle & lightning, multicolor twinkle and chase twinkle removed
    2026-10-22: their constant Matter updates were suspected in the Govee drops) by
    default (user choice 2026-10-11; was 5). Colors: orange, purple, green, red.'
  mode: restart
  icon: mdi:halloween
  fields:
    minutes:
      name: Minutes per look
      default: 1
      selector:
        number:
          min: 0.5
          max: 60
          step: 0.5
          unit_of_measurement: min
  sequence:
  - action: script.porch_holiday_cycle
    data:
      minutes: '{{ minutes | default(1) }}'
      looks:
      - effect: Halloween
      - script: porch_halloween
        data:
          swap: false
      - script: porch_halloween_multicolor
      - effect: Halloween B
      - script: porch_halloween
        data:
          swap: true

