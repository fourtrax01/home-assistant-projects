porch_birthday_cycle:
  alias: Porch - Birthday Cycle
  description: 'Birthday rotation for the porch wall lights (runs Porch - Holiday
    Cycle) on Kid 1 , Kid 2  and Parent 2  birthdays from the holiday
    lights calendar: Govee Birthday, color chase twinkle, multicolor twinkle.'
