porch_halloween:
  alias: Porch - Halloween Pumpkin & Potion
  description: 'Halloween look for the six H7076 porch wall lights via govee2mqtt
    segments, same layout as Porch - Christmas. Left to right from the street (1 Porch,
    2 Walk/Porch, 3 Walkway, 4 Left, 5 Center, 6 Right): positions 2/4/6 get orange
    tops and purple sides, 1/3/5 purple tops and orange sides (swap=true flips). Bottoms
    are green.'
  mode: single
  icon: mdi:halloween
  fields:
    swap:
      name: Swap
      description: Swap which lights get orange vs purple tops
      default: false
      selector:
        boolean: {}
  sequence:
  - variables:
      order:
      - porch_wall_light
      - walk_porch_light
      - walkway_wall_light
      - left_wall_light
      - center_wall_light
      - right_wall_light
      odd: '{{ order[1::2] }}'
      even: '{{ order[0::2] }}'
      a: '{{ even if swap | default(false) else odd }}'
      b: '{{ odd if swap | default(false) else even }}'
      orange:
      - 255
      - 90
      - 0
      purple:
      - 160
      - 0
      - 255
      green:
      - 0
      - 255
      - 30
  - action: light.turn_on
    target:
      entity_id: '{{ a | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_001'')
        | list + b | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_003'')
        | list + b | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_004'')
        | list }}'
    data:
      rgb_color: '{{ orange }}'
  - action: light.turn_on
    target:
      entity_id: '{{ b | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_001'')
        | list + a | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_003'')
        | list + a | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_004'')
        | list }}'
    data:
      rgb_color: '{{ purple }}'
  - action: light.turn_on
    target:
      entity_id: '{{ (a + b) | map(''regex_replace'', ''^(.*)$'', ''light.\\1_segment_002'')
        | list }}'
    data:
      rgb_color: '{{ green }}'
  - alias: Remember the look (resumed after porch activity clears)
    action: input_text.set_value
    target:
      entity_id: input_text.porch_current_look
    data:
      value: '{{ ''script.porch_halloween:swap'' if swap | default(false) else ''script.porch_halloween''
        }}'

porch_halloween_multicolor:
  alias: Porch - Halloween Multicolor
  description: 'Each porch wall light gets its own Halloween top/bottom color over
    Matter, then its own side color via govee segments (Matter RGB recolors the sides,
    so sides go last). Colors: orange, purple, green, red (user pick 2026-10-03).
    Left to right from the street, top/sides: Porch orange/green, Walk/Porch purple/orange,
    Walkway green/purple, Left red/orange, Center orange/purple, Right purple/red.
    Every pair is different and no neighbors mirror each other.'
  mode: single
  icon: mdi:halloween
  sequence:
  - alias: Nudge first - Matter lights ignore a color they already report
    action: light.turn_on
    target:
      entity_id: light.porch_effect_group
    data:
      color_temp_kelvin: 4000
  - delay: 00:00:02
  - action: light.turn_on
    target:
      entity_id: light.porch_wall_light
    data:
      rgb_color:
      - 255
      - 100
      - 0
  - action: light.turn_on
    target:
      entity_id: light.walk_porch_light
    data:
      rgb_color:
      - 180
      - 0
      - 255
  - action: light.turn_on
    target:
      entity_id: light.walkway_wall_light
    data:
      rgb_color:
      - 0
      - 255
      - 0
  - action: light.turn_on
    target:
      entity_id: light.left_wall_light
    data:
      rgb_color:
      - 255
      - 0
      - 0
  - action: light.turn_on
    target:
      entity_id: light.center_wall_light
    data:
      rgb_color:
      - 255
      - 100
      - 0
  - action: light.turn_on
    target:
      entity_id: light.right_wall_light
    data:
      rgb_color:
      - 180
      - 0
      - 255
  - alias: Sides after the Matter colors
    delay: 00:00:05
  - alias: 'Porch: orange top, green sides'
    action: light.turn_on
    target:
      entity_id:
      - light.porch_wall_light_segment_003
      - light.porch_wall_light_segment_004
    data:
      rgb_color:
      - 0
      - 255
      - 30
  - alias: 'Walk/Porch: purple top, orange sides'
    action: light.turn_on
    target:
      entity_id:
      - light.walk_porch_light_segment_003
      - light.walk_porch_light_segment_004
    data:
      rgb_color:
      - 255
      - 100
      - 0
  - alias: 'Walkway: green top, purple sides'
    action: light.turn_on
    target:
      entity_id:
      - light.walkway_wall_light_segment_003
      - light.walkway_wall_light_segment_004
    data:
      rgb_color:
      - 180
      - 0
      - 255
  - alias: 'Left: red top, orange sides'
    action: light.turn_on
    target:
      entity_id:
      - light.left_wall_light_segment_003
      - light.left_wall_light_segment_004
    data:
      rgb_color:
      - 255
      - 100
      - 0
  - alias: 'Center: orange top, purple sides'
    action: light.turn_on
    target:
      entity_id:
      - light.center_wall_light_segment_003
      - light.center_wall_light_segment_004
    data:
      rgb_color:
      - 180
      - 0
      - 255
  - alias: 'Right: purple top, red sides'
    action: light.turn_on
    target:
      entity_id:
      - light.right_wall_light_segment_003
      - light.right_wall_light_segment_004
    data:
      rgb_color:
      - 255
      - 0
      - 0
  - alias: Remember the look (resumed after porch activity clears)
    action: input_text.set_value
    target:
      entity_id: input_text.porch_current_look
    data:
      value: script.porch_halloween_multicolor
  - alias: Stay 'on' while the side-color automation's queued runs check
    delay: 00:00:30

